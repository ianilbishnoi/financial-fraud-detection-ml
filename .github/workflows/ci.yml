name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  train:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download the dataset (284,807 transactions)
        run: curl -fsSL --retry 3 -o creditcard.csv https://storage.googleapis.com/download.tensorflow.org/data/creditcard.csv
      - name: Train and evaluate on the full dataset
        run: python fraud_detection.py --data creditcard.csv --out reports
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
